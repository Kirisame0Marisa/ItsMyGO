spring:
  datasource:
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    url: jdbc:mysql://${DB_HOST:192.168.56.9}:${DB_PORT:3306}/${DB_NAME:bang_pms}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mybatis-plus:
    mapper-locations: classpath:/mapper/**/*.xml
    global-config:
      db-config:
        id-type: auto
        logic-delete-value: 1
        logic-not-delete-value: 0


  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

  jackson:
    date-format: yyyy-MM--dd HH:mm:ss
  thymeleaf:
    cache: false
  redis:
    host: ${REDIS_HOST:192.168.56.9}
    port: ${REDIS_PORT:6379}

alibaba:
  cloud:
    access-key: ${ALIBABA_ACCESS_KEY:}
    secret-key: ${ALIBABA_SECRET_KEY:}
    oss:
      endpoint: ${OSS_ENDPOINT:oss-cn-chengdu.aliyuncs.com}  #地域节点



server:
  port: 12000